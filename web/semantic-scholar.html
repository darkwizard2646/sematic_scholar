<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper</title>

    <style>
        p {
            margin: 0 !important;
        }

        p.secondary {
            margin-left: 20px !important;
        }
    </style>
</head>

<body>
    <h2>Paper</h2>
    <textarea id="inputText" rows="4" cols="50"></textarea><br>
    <button onclick="sendRequest()">Submit</button>
    <div id="output-count"></div>
    <div id="output"></div>

    <script>

        function wait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
        
        function downloadTxtFile(text, filename) {
            // Create a Blob containing the text
            const blob = new Blob([text], { type: 'text/plain' });

            // Create a temporary anchor element
            const anchor = document.createElement('a');
            anchor.href = URL.createObjectURL(blob);
            anchor.download = filename;

            // Append the anchor to the body
            document.body.appendChild(anchor);

            // Trigger the click event on the anchor
            anchor.click();

            // Cleanup
            document.body.removeChild(anchor);
            URL.revokeObjectURL(anchor.href);
        }

        async function download(url, filename) {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                // Create a temporary anchor element
                const anchor = document.createElement('a');
                anchor.href = URL.createObjectURL(blob);
                anchor.download = filename;

                // Append the anchor to the body
                document.body.appendChild(anchor);

                // Trigger the click event on the anchor
                anchor.click();

                // Cleanup
                document.body.removeChild(anchor);
                URL.revokeObjectURL(anchor.href);
                return true;
            } catch (error) {
                console.error("Error downloading PDF:", error);
                return false;
            }
        }

        async function pdf_download(filename) {
            var data = await await fetch('/single_link?paper_id=' + filename)
                .then(response => response.json())
                .then(data => {
                    return data;
                })
                .catch(error => console.error('Error:', error));

            console.log(data);
            
            var statusParam = document.getElementById(filename);

            if (data.status === 0) {
                statusParam.innerHTML += " - not connected";
                return;
            }

            if (download(data.url, filename)) {
                statusParam.innerHTML += " - Download Success!";
            } else {
                statusParam.innerHTML += " - Download Faild!";
            }
        }

        async function sendRequest() {
            var input = document.getElementById('inputText').value;
            var arr = input.split(',');
            var inputArray = arr.map(item => item.trim());
            var outputCountDiv = document.getElementById('output-count');
            var outputDiv = document.getElementById('output');

            var urls = [];
            var totalData = {};

            // Initialize UI
            outputDiv.innerHTML = "";
            outputCountDiv.innerHTML = "";

            outputCountDiv.innerHTML = '<h2>Total Paper Count: ' + inputArray.length + '</h2>';

            var firstStepDiv = document.createElement('div');
            firstStepDiv.innerHTML = '<h4>1. Getting citations and references of all papers</h4>';
            outputDiv.appendChild(firstStepDiv);

            let num = 0;

            for (var index = 0; index < inputArray.length; index++) {
                var hashId = inputArray[index];
                var hashDiv = document.createElement("div");
                hashDiv.innerHTML = "<h5>From By " + hashId + "</h5>";
                outputDiv.appendChild(hashDiv);
                var data = await await fetch('/paper_link?paper_id=' + hashId)
                    .then(response => response.json())
                    .then(data => {
                        return data;
                    })
                    .catch(error => console.error('Error:', error));

                if (data.status === 1) {
                    for (let i = 0; i < data.urls.length; i++) {
                        if(!urls.includes(data.urls[i])) {
                            urls.push(data.urls[i]);
                            var resultDiv = document.createElement("div");
                            resultDiv.innerHTML = "<p id=" + data.urls[i] + ">" + (++num) + ' . ' + data.urls[i] + '</p>';
                            outputDiv.appendChild(resultDiv);
                        }
                    }
                }
                else if (data.status !== 1 || data.urls.length == 0) {
                    var resultDiv = document.createElement("div");
                    resultDiv.innerHTML = "<p>No Result from " + hashId + "</p>";
                    outputDiv.appendChild(resultDiv);
                }
                // await wait(10000);
            }

            console.log('url get successed.', num)

            for(let i = 0; i < num; i++) {
                // console.log(i)
                pdf_download(urls[i]);
            }
            // var finishedDiv = document.createElement('div');
            // finishedDiv.innerHTML = "<h1>Finished!!! :)</h1>"
            // console.error(downloadUrls)
            // downloadTxtFile(downloadUrls.join('\r\n'), 'paper-download-urls.txt');
            // outputDiv.appendChild(finishedDiv)
        }
    </script>
</body>

</html>
